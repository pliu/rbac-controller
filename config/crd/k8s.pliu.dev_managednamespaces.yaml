---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: managednamespaces.k8s.pliu.dev
spec:
  group: k8s.pliu.dev
  names:
    kind: ManagedNamespace
    listKind: ManagedNamespaceList
    plural: managednamespaces
    shortNames:
    - mns
    singular: managednamespace
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ManagedNamespaceSpec configures the namespace named by metadata.name. The
              resource's own name is the namespace name, so there is exactly one
              ManagedNamespace per namespace.
            properties:
              accessMappings:
                items:
                  description: |-
                    AccessMapping grants a single group OR a list of users a set of ClusterRoles.
                    It is namespace-scoped as an entry in a ManagedNamespace, and cluster-wide as
                    the spec of a ClusterAccessMapping. Exactly one of group or users is set.
                  properties:
                    clusterRoles:
                      items:
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                    group:
                      type: string
                    users:
                      description: |-
                        Users are each bound as an individual User subject. Order and repetition
                        do not matter; the set is what is granted.
                      items:
                        minLength: 1
                        type: string
                      type: array
                  required:
                  - clusterRoles
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of group or users
                    rule: (has(self.group) && size(self.group) > 0) != (has(self.users)
                      && size(self.users) > 0)
                type: array
              annotations:
                additionalProperties:
                  type: string
                description: |-
                  Annotations are applied to the managed Namespace and kept in sync.
                  Annotations managed by other actors are preserved; controller-owned
                  annotations take precedence on conflicts.
                type: object
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are applied to the managed Namespace and kept in sync. Labels
                  managed by other actors are preserved; controller-owned labels take
                  precedence on conflicts.
                type: object
              resourceQuotas:
                description: |-
                  ResourceQuotas are applied to the namespace; removing an entry removes
                  that managed quota. Names must be unique.
                items:
                  description: |-
                    ResourceQuota is one ResourceQuota applied to the managed namespace. Name is
                    the object created there; the remaining fields are a Kubernetes
                    ResourceQuotaSpec (hard, scopes, and scopeSelector).
                  properties:
                    hard:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: |-
                        hard is the set of desired hard limits for each named resource.
                        More info: https://kubernetes.io/docs/concepts/policy/resource-quotas/
                      type: object
                    name:
                      description: Name is the name of the ResourceQuota created in
                        the namespace.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    scopeSelector:
                      description: |-
                        scopeSelector is also a collection of filters like scopes that must match each object tracked by a quota
                        but expressed using ScopeSelectorOperator in combination with possible values.
                        For a resource to match, both scopes AND scopeSelector (if specified in spec), must be matched.
                      properties:
                        matchExpressions:
                          description: A list of scope selector requirements by scope
                            of the resources.
                          items:
                            description: |-
                              A scoped-resource selector requirement is a selector that contains values, a scope name, and an operator
                              that relates the scope name and values.
                            properties:
                              operator:
                                description: |-
                                  Represents a scope's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists, DoesNotExist.
                                type: string
                              scopeName:
                                description: The name of the scope that the selector
                                  applies to.
                                type: string
                              values:
                                description: |-
                                  An array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty.
                                  This array is replaced during a strategic merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - operator
                            - scopeName
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                      type: object
                      x-kubernetes-map-type: atomic
                    scopes:
                      description: |-
                        A collection of filters that must match each object tracked by a quota.
                        If not specified, the quota matches all objects.
                      items:
                        description: A ResourceQuotaScope defines a filter that must
                          match each object tracked by a quota
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              invalidReferences:
                items:
                  properties:
                    clusterRole:
                      type: string
                    reason:
                      type: string
                  required:
                  - reason
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be at most 63 characters
          rule: size(self.metadata.name) <= 63
    served: true
    storage: true
    subresources:
      status: {}
